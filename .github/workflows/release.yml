name: Release

# Push a tag like v0.1.0 and this builds release binaries for the major
# platforms and attaches them to a GitHub release. The binary name is read
# from Cargo.toml, so this keeps working after ./setup.sh renames the
# project.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: release
    permissions:
      contents: write
    name: Build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          NAME="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          ARCHIVE="$NAME-$GITHUB_REF_NAME-${{ matrix.target.name }}"
          mkdir "$ARCHIVE"
          cp README.md "$ARCHIVE/" 2>/dev/null || true
          cp LICENSE* "$ARCHIVE/" 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/release/$NAME.exe" "$ARCHIVE/"
            7z a "$ARCHIVE.zip" "$ARCHIVE"
            echo "ASSET=$ARCHIVE.zip" >> "$GITHUB_ENV"
          else
            cp "target/release/$NAME" "$ARCHIVE/"
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
            echo "ASSET=$ARCHIVE.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

  publish:
    name: Publish completed release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release after all binaries are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
